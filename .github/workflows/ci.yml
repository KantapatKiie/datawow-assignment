name: CI

on:
  push:
    branches: [main, develop, uat, production, 'release/**']
  pull_request:
    branches: [main, develop, uat, production, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run test:web

  build:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  smoke:
    name: k6 smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start the stack
        run: docker compose up --build -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:4000/api/health > /dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs api
          exit 1
      - uses: grafana/setup-k6-action@v1
      - run: k6 run apps/api/test/k6/smoke.js
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
